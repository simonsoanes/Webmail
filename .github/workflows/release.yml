# Public release image for the GitHub mirror (https://github.com/simonsoanes/Webmail): when a v1.2.3 tag
# arrives, run the tests, push ghcr.io/simonsoanes/webmail for amd64 and arm64, and publish a GitHub release.
# Day-to-day CI/CD stays in .gitea/workflows; Gitea ignores this folder because that one exists.
#
# Tags: a v1.2.3 tag pushes :1.2.3, :1.2 and :latest. Needs no secrets; GITHUB_TOKEN writes the package.
name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)publish, e.g. v0.1.0"
        required: true

permissions:
  contents: write
  packages: write

env:
  REF: ${{ inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.REF }}

      - name: Determine version
        run: |
          version="${REF#v}"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "Releasing version $version"

      # Both suites run inside Dockerfile stages, so the runner needs neither .NET, Node nor GnuPG.
      - name: Tests
        run: docker build --target test --build-arg VERSION="$VERSION" .

      - name: OpenPGP interop tests
        run: docker build --target test-pgp .

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ env.REF }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.REF }}
            type=raw,value=latest

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ env.VERSION }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          push: true

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}:$VERSION"
          notes="Container image: \`docker pull $image\`"
          if gh release view "$REF" >/dev/null 2>&1; then
            echo "Release $REF already exists; leaving it as it is."
          else
            gh release create "$REF" --title "$REF" --generate-notes --notes "$notes" \
              $([[ "$VERSION" == *-* ]] && echo --prerelease)
          fi
