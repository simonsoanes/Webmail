<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>Offline</title>
    <style>
        :root { --bg: #f4f5f7; --surface: #ffffff; --text: #151a23; --muted: #6b7385; --border: #e4e7ec; --accent: #3b5bdb; --accent-text: #ffffff; }
        @media (prefers-color-scheme: dark) {
            :root { --bg: #0f1115; --surface: #16191f; --text: #e7e9ee; --muted: #8f97a8; --border: #262b34; --accent: #6d8cff; --accent-text: #0b0f1d; }
        }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 1rem; background: var(--bg); color: var(--text);
               font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
        .card { max-width: 360px; width: 100%; text-align: center; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 2rem 1.5rem; }
        svg { width: 48px; height: 48px; }
        h1 { font-size: 1.15rem; margin: 1rem 0 .35rem; }
        p { color: var(--muted); margin: 0 0 1.25rem; }
        a { display: inline-block; padding: .55rem 1.1rem; border-radius: 8px; background: var(--accent); color: var(--accent-text); text-decoration: none; font-weight: 600; }
    </style>
</head>
<body>
    <div class="card">
        <svg viewBox="0 0 32 32" aria-hidden="true"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3b5bdb"/><stop offset="1" stop-color="#5f5be7"/></linearGradient></defs><rect width="32" height="32" rx="8" fill="url(#g)"/><g transform="translate(5 5) scale(.9167)" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M3.5 7 12 13l8.5-6"/></g></svg>
        <h1>You're offline</h1>
        <p>WebMail needs a connection to the server. Your mail is never stored on this device.</p>
        <a href="">Try again</a>
    </div>
</body>
</html>
